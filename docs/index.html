<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Tiempo Extra IA</title>
<style>
:root{--bg:#070b16;--card:#0f1626;--tx:#f2f5fb;--mu:#98a3b8;--red:#e4162b;--bd:#222c44}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 300px at 50% -80px,#13307a,transparent 70%),var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}h1{margin:0;font-size:26px;font-style:italic}h1 b{color:var(--red)}
.sub{color:var(--mu);font-size:13px;margin:2px 0 14px}.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
h2{margin:0 0 8px;font-size:16px}.m{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--bd);font-size:13px}
.tag{background:var(--red);border-radius:99px;font-size:10px;padding:2px 8px;font-weight:700}
textarea{width:100%;min-height:90px;background:#0a0f1c;color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:8px;font:inherit;margin-top:6px}
button{font:inherit;border:0;border-radius:10px;padding:8px 12px;background:var(--red);color:#fff;font-weight:700;margin:6px 6px 0 0}button.s{background:var(--bg);border:1px solid var(--bd)}
p{margin:4px 0;color:var(--mu);font-size:13px}
</style></head><body><main>
<h1>TIEMPO <b>EXTRA</b> IA</h1><div class="sub" id="upd">Cargando…</div>
<div id="ideas"></div><div class="card"><h2>⚽ Partidos</h2><div id="par"></div></div>
<script>
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
fetch('data.json').then(r=>r.json()).then(d=>{
 document.getElementById('upd').textContent='Actualizado: '+new Date(d.actualizado).toLocaleString();
 document.getElementById('ideas').innerHTML=d.ideas.map((x,i)=>`<div class="card"><span class="tag">${E(x.tipo)}</span><h2 style="margin-top:6px">${E(x.titulo)}</h2><p>${E(x.porque)}</p>
 <textarea id="d${i}">${E(x.descripcion)}\n\n${E(x.hashtags)}</textarea>
 <textarea id="g${i}">${E(x.guion)}</textarea>
 <button onclick="navigator.clipboard.writeText(d${i}.value)">Copiar post</button><button class="s" onclick="hablar(g${i}.value)">▶ Voz</button><button class="s" onclick="speechSynthesis.cancel()">■</button></div>`).join('');
 document.getElementById('par').innerHTML=d.partidos.sort((a,b)=>a.fecha<b.fecha?-1:1).map(m=>`<div class="m"><span>${E(m.local)} ${m.gl??''} - ${m.gv??''} ${E(m.visita)}</span><span style="color:var(--mu)">${E(m.liga)} · ${new Date(m.fecha).toLocaleDateString()}</span></div>`).join('');
}).catch(()=>document.getElementById('upd').textContent='Aún no hay datos: ejecuta la acción "actualizar" en GitHub.');
function hablar(t){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='es-ES';speechSynthesis.speak(u)}
</script></main></body></html>
